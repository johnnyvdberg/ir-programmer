name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --tests io.github.g20ir.EncoderTest
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "G20_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signing with a throwaway debug key"
          fi
      - name: Build APK
        env:
          G20_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          G20_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          G20_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk g20-ir-setup-${GITHUB_REF_NAME}.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: g20-ir-setup-*.apk
          generate_release_notes: true
          body: |
            Android TV app that programs the IR keys of the Google G20 remote from the Shield.

            Install: enable Network debugging on the Shield, then
            `adb connect <shield-ip>:5555` and `adb install -r g20-ir-setup-${{ github.ref_name }}.apk`.
            See the README for how the guided setup works.
